# Chegô no servidor (VPS): app + PostgreSQL + Caddy (HTTPS automático e senha de acesso).
# As variáveis vêm do arquivo .env ao lado deste (modelo em .env.vps.example).
# Passo a passo em docs/DEPLOY_VPS.md.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: chego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: chego
      TZ: America/Maceio
      PGTZ: America/Maceio
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chego -d chego"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sem "ports": o banco só é alcançado pelo app, nunca pela internet.

  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-local}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "local" = homologação: código de login 123456, página /dev e pagamento simulado.
      # O site inteiro fica protegido pela senha do Caddy.
      APP_ENV: ${APP_ENV:-local}
      DB_MODE: external
      DATABASE_URL: postgres://chego:${POSTGRES_PASSWORD}@db:5432/chego
      # Cria os dados de teste na primeira vez que o banco sobe vazio.
      SEED_IF_EMPTY: ${SEED_IF_EMPTY:-1}
      LOGIN_USERNAME_DOMAIN: ${LOGIN_USERNAME_DOMAIN:-chego.local}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?defina PAYMENT_WEBHOOK_SECRET no .env}
      CRON_SECRET: ${CRON_SECRET:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - storage:/app/storage
    # Sem "ports": só o Caddy fala com o app.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?defina BASIC_AUTH_USER no .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?defina BASIC_AUTH_HASH no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
