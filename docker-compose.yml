# Chegô no servidor (VPS): app + PostgreSQL + Caddy (HTTPS automático).
# As variáveis vêm do arquivo .env ao lado deste (modelo em .env.vps.example).
# Passo a passo em docs/DEPLOY_VPS.md.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: chego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: chego
      TZ: America/Maceio
      PGTZ: America/Maceio
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chego -d chego"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sem "ports": o banco só é alcançado pelo app, nunca pela internet.

  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-production}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "production": sem página /dev, sem atalhos de teste, login por telefone e senha.
      APP_ENV: ${APP_ENV:-production}
      DB_MODE: external
      DATABASE_URL: postgres://chego:${POSTGRES_PASSWORD}@db:5432/chego
      # Na primeira vez que o banco sobe vazio, cria só o necessário (sem lojas nem pessoas de teste) e o admin.
      SEED_IF_EMPTY: "1"
      SEED_MODE: ${SEED_MODE:-base}
      ADMIN_NAME: ${ADMIN_NAME:-Admin Chegô}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      # Pagamento simulado: nenhum dinheiro é cobrado e o cliente confirma o pagamento na tela.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?defina PAYMENT_WEBHOOK_SECRET no .env}
      # As tarefas agendadas (expirar Pix, recusa automática, lembretes, faturas) rodam dentro do app.
      INTERNAL_TASK_RUNNER: "1"
      CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET no .env}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - storage:/app/storage
    # Sem "ports": só o Caddy fala com o app.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
