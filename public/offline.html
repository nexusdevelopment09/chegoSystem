<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem internet · Chegô</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff8f1;
        color: #24160c;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: #5c4632; margin: 0 auto 24px; max-width: 32rem; }
      code { background: #ffe9d6; border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #b4480f;
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" width="72" height="72" />
      <h1 id="title">Você está sem internet.</h1>
      <p id="text">Assim que voltar, a gente continua.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      // Neste computador (ou na rede de casa) o motivo quase nunca é a internet: é o app desligado.
      var host = location.hostname;
      var local = host === "localhost" || host === "127.0.0.1" || host.indexOf("192.168.") === 0 || host.indexOf("10.") === 0 || host.indexOf("172.") === 0;
      if (local) {
        document.getElementById("title").textContent = "O Chegô está desligado neste computador.";
        document.getElementById("text").innerHTML = "A sua internet está normal. No terminal, na pasta do projeto, rode <code>npm run db:start</code> e depois <code>npm run dev</code>. Depois toque em Tentar de novo.";
      }
    </script>
  </body>
</html>
